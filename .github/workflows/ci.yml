name: ci
on:
  push:
  pull_request:
jobs:
  ci:
    # Apple Silicon: the speech stack (MLX Whisper) only installs on arm64 macOS.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: brew install shellcheck
      - run: uv sync --frozen
      # The phone app's gate (APP in run-ci.sh) runs where app/node_modules is installed.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
        working-directory: app
      - run: bash scripts/run-ci.sh
        env:
          CI: "1"
