# Copy to config.toml and edit. Every key is optional; these are the defaults.

[wake]
# Wake if one of these appears in the first `max_position` words ("Hey Scout, ...").
names = ["scout"]   # add "claude" to keep answering to the old name too
greeted_names = ["scott"]   # wake only after a greeting: "Hey Scott" yes, "Scott said" no
max_position = 3
# After Scout answered your request, keep listening this long for a follow-up without
# the wake word (0 = off). Announcements and startup open no window; no chains.
follow_up_seconds = 8.0
# "strict": the follow-up must look addressed to Scout (a question, a command, a short
# fragment; not a statement or talk to someone else). "open": any speech that passes the
# gate. "off": always say the wake word.
follow_up = "strict"
wait_seconds = 20.0   # after "hang on" / "wait" / "give me a sec"

[audio]
backend = "auto"          # auto (= webrtc), webrtc, apple (scripts/build-voiceio.sh), plain
barge_in = true           # talking over the assistant stops it (needs webrtc or apple)
noise_suppression = false # webrtc: on can remove steady-noise bands from speech too
turn_detection = "smart"  # smart (Silero + smart-turn) or simple (silence_ms of quiet)
min_pause_ms = 250        # smart: ask the turn model after this much quiet
max_pause_ms = 1500       # smart: end the turn after this much quiet regardless
turn_threshold = 0.5      # smart: "finished" probability that ends the turn
input_device = ""     # name substring or index from `uv run scout --list-devices`
output_device = ""
vad_aggressiveness = 2
silence_ms = 1200     # pause that ends an utterance
min_speech_ms = 300
max_utterance_s = 30.0
echo_tail_ms = 400
# output_delay_ms = 700    # a TV's own delay: the first guess until the echo path is measured
echo_calibration = true    # webrtc: measure each speaker+mic pair's echo path, keep it (state/audio_devices.json)
calibrate_chirp = true     # ...with a short quiet sweep when the room is quiet, if speech hasn't measured it
save_utterances = 0   # keep the last N clips in state/utterances/ for tuning

[gate]
# Local checks every transcript must pass before it reaches Claude (no tokens spent on rejects).
# Rejections are logged as "ignored ... (reason)" and shown struck through on the web page.
min_logprob = -1.0            # Whisper confidence floor with the wake word
min_logprob_followup = -0.9   # stricter without it
max_no_speech_prob = 0.6
max_compression_ratio = 2.4
max_words_per_second = 6.0
min_words_per_second = 0.5    # a 4 s+ clip with fewer words than this was mostly not transcribed
coverage_min_seconds = 4.0
followup_min_words = 2
followup_min_snr_db = 10.0    # follow-ups must be this far above the room's noise
followup_max_drop_db = 12.0   # ...and not this much quieter than your last "Hey Scout"

[asr]
model = "mlx-community/whisper-large-v3-turbo"  # smaller/faster: mlx-community/whisper-small-mlx
language = "en"
prompt = ""            # optional hint like "Scout"; never "Hey Scout." (Whisper drops a prompt it hears again)

[tts]
model = "models/kokoro-v1.0.onnx"
voices = "models/voices-v1.0.bin"
voice = "af_heart"    # e.g. af_bella, am_michael, bf_emma, bm_george
speed = 1.1
chimes = true
working_sound = true  # soft tick while tools run
progress_speech = true  # a short spoken line ("Checking your mail.") when a lookup runs long
progress_delay_s = 2.0  # quiet seconds before it
progress_again_s = 12.0  # then "Still working on it." (0: never)

[claude]
cwd = "~"                     # where the agent works
model = ""                    # e.g. "sonnet" for snappier replies; empty = Claude Code default
permission_mode = "default"   # "" = use defaultMode from your settings
setting_sources = []          # ["user"] loads all of ~/.claude (CLAUDE.md, skills, hooks): ~30% more tokens a turn
inherit_settings = ["permissions", "model", "effortLevel", "alwaysThinkingEnabled"]  # from ~/.claude/settings.json when "user" isn't loaded
plugins = "scout"             # Scout's skills; "enabled" adds every plugin enabled in ~/.claude; "none"
confirm_timeout_s = 30.0
# "strict": only the two lists below run without a spoken yes; your ~/.claude allow rules don't apply.
# "settings": your ~/.claude allow rules and hooks apply; you're asked aloud only where Claude Code would prompt.
# "settings_no_hooks": same, but your hooks are off (a hook answering "allow" skips every prompt).
approval_policy = "strict"
always_ask = ["Bash(git push:*)", "Bash(gh pr merge:*)", "Bash(gh pr create:*)"]  # settings policies only
remote_control = ""           # e.g. "scout" to show the session in Remote Control
# always_load_tools = ["remember", "forget", "tasks_list", "reminder_add"]   # in the prompt from the start; the rest load via ToolSearch
auto_allow_tools = ["Read", "Glob", "Grep", "LS", "WebSearch", "TodoWrite", "ToolSearch", "Task", "Agent", "BashOutput", "NotebookRead"]   # secrets stay unreadable
auto_allow_commands = ["date", "cal", "uptime", "whoami", "pwd", "ls", "df", "du", "which", "sw_vers"]
extra_system_prompt = ""
local_recall = true           # tier 1 also answers the weather, tasks and "what did Pat say about..." from Scout's records
recall_min_similarity = 0.64  # a record found by meaning must be this close to be read; else Claude answers

[web]
enabled = true
hosts = ["localhost", "lan", "tailscale"]   # never all interfaces; drop "lan" to keep it off Wi-Fi
port = 8765
# public_url = "https://<mac>.<tailnet>.ts.net"  # where record links (/r/<id>) point; empty: the Tailscale Serve name

[floor]
hold_seconds = 10.0       # a session may keep the floor this long between turns
room_wait_seconds = 15.0  # a "Hey Scout" request waits this long for a session to finish

[calendar]
work_start = "09:00"  # free time is looked for in working hours ("when am I free tomorrow", calendar_free)
work_end = "17:00"

[briefing]
at = ""  # e.g. "07:30" to hear the briefing every day; "brief me" works either way

[behavior]
# Rules for how Scout behaves live in memory/behavior.md (docs/behavior-rules.md). Each
# night the local model reads the day's corrections and drafts up to 3 rules, which the
# morning briefing offers one at a time; nothing is kept without a yes. "" = off.
nightly_at = "03:30"

[messages]
# Read iMessage and SMS history (read-only) through the scout-messages helper,
# the only program given Full Disk Access. false = the messages_* tools refuse.
enabled = true

[contacts]
# Look people up in Contacts (read-only) through the scout-contacts helper, which asks
# for its own Contacts permission once (docs/contacts.md). false = the contacts tools
# refuse, and texts and mail show numbers and addresses as they are.
enabled = true

[starlink]
# The Starlink dish's local API: status, outages, data used. Off unless turned on.
# enabled = true
# announce = true                 # say outages, recoveries and new alerts
# announce_outage_s = 60
# quiet_hours = "22:00-08:00"     # only logged in these hours
# ignore_alerts = ["is_heating"]

[reference]
# Offline reference (docs/reference.md): Kiwix .zim archives (Wikipedia, WikiMed, iFixit...),
# searched in place through kiwix-serve, which Scout runs (scripts/install-kiwix.sh installs it).
# scripts/fetch-reference.sh downloads them (large: check the sizes first).
# dir = "reference"                      # in Scout's data folder
# archives = []                          # e.g. ["wikipedia_en_all_nopic", "ifixit_en_all"]; empty: all
# local_answers = "offline"              # Scout answers from them itself: offline, always, never
# port = 8769                            # kiwix-serve listens on 127.0.0.1 here

[phone]
# Talk to Scout from the paired phone app through SignalWire (docs/phone-design.md).
# Off unless turned on. api_token and signing_key are secrets: keep this file mode 600.
# enabled = true
# space = "<your-space>.signalwire.com"
# project_id = "<project id>"
# api_token = "<API token>"
# signing_key = "<signing key>"            # verifies every webhook comes from SignalWire
# public_url = "https://<mac>.<tailnet>.ts.net:8443"   # the Funnel base SignalWire calls
# address = "<the agent's address>"        # what the app dials; part of each call's signature
# host = "127.0.0.1"
# port = 8768
# call_skew_s = 60                         # a call's signed timestamp may be this far off
# subscriber = "scout-owner"               # who the /phone test page signs in to SignalWire as
# pair_mode = "tailnet"   # how the app pairs: "tailnet" / "approve" (it asks; a paired phone, the web UI,
#                         # the room, the Mac's alert or `scoutctl phone pair approve <id>` says yes), "code" (QR only)
# owners = []             # Tailscale logins that count as you, besides this Mac's own (shown in the prompt)
# pair_alert = true       # also ask about a pairing request in an alert on this Mac

[tasks]
# Scout's task list (docs/tasks-design.md): found in meetings and email, ordered by plain code,
# mirrored to Reminders.
# me = ["Pat", "pat@example.com"]          # your names and addresses: tells your tasks from others'
# mirror = true                           # open tasks in Reminders (yours, and what others owe you)
# mirror_list = "Scout"
# waiting_list = "Waiting On"
# farm = true                             # find tasks in new meetings, mail and Slack
# farm_every_min = 10
# backfill_days = 14                      # on the first run, read this far back
# extract_model = "claude-haiku-5-5"      # reads meetings; mail and Slack stay with the local model

[sync]
# Background syncs heal themselves: a pass held back by a busy room runs anyway once it's
# this many intervals late, in the first gap of gap_s seconds with nobody speaking; a
# stalled sync is woken first and spoken of only if it's still stalled grace_min later.
# overdue_times = 3
# gap_s = 3
# grace_min = 10

[granola]
# Granola meeting notes in local search and the task farm (a personal API key: Granola,
# Settings, Connectors, API keys; Business plan or above). A secret: keep this file mode 600.
# api_key = "<grn_ key>"
# every_min = 30

[slack]
# Slack messages in local search and the task farm (docs/slack.md: a Slack app with a user
# token). A secret: keep this file mode 600. Empty token: off.
# token = "<xoxp- user token>"
# every_min = 15
# backfill_days = 14
# skip = ["random", "Pat"]                # channels, or the person a DM is with, to leave out
# app_token = "<xapp- app-level token>"  # live events over Socket Mode (connections:write)
# live_every_min = 60                     # the poll while live events are flowing
# announce = ["Luca"]                     # say out loud when they DM you (who, never what)
# announce_dms = "listed"                 # "listed" (the people above), "all" (every DM), or "off"
# announce_mentions = false               # also say an @-mention of you in a channel
# How often (docs/slack.md, Alerts): a conversation's burst is said once, after this long
# with nothing new there, at most announce_max_wait_s after its first message; at most one
# Slack announcement every announce_min_gap_min (the rest merged into the next); and not
# a conversation you wrote in within announce_skip_if_replied_min.
# announce_quiet_s = 45
# announce_max_wait_s = 180
# announce_min_gap_min = 5
# announce_skip_if_replied_min = 5

[github]
# GitHub issues, PRs and commits named in Slack, mail, meetings, notes and tasks become
# records with their state (docs/links.md, "GitHub"). Read-only. The token is the one the
# gh CLI is logged in with (`gh auth login`) unless `token` is set (a secret: mode 600).
# enabled = false
# token = "<github token>"
# orgs = ["signalwire"]                   # only these owners' repos ([] with no repos: all)
# repos = ["someone/tool"]                # and/or these repos
# every_min = 10                          # fetch new items, refresh the ones due
# open_every_min = 30                     # an open item is checked this often (with its ETag)
# closed_every_days = 7                   # a closed or merged one this rarely; commits never

[confirm]
# Sends and calls for a Claude session (mail_send, slack_send, message_send, call_start)
# are confirmed by your spoken yes in the room. typed = true lets a session skip that when
# you already approved the exact message in its chat (it passes approved: "typed"): Scout
# logs it, sends, and says "Sent to <who>." Never for other tools, the phone or the room.
# typed = false
