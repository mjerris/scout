[project]
name = "claude-voice"
version = "0.1.0"
description = "Always-on local voice front-end (wake word, ASR, TTS) for a Claude Code agent"
authors = [
    { name = "Michael Jerris", email = "mike@jerris.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.14.4",
    "claude-agent-sdk>=0.2.164",
    "kokoro-onnx>=0.6.1",
    "mlx-whisper>=0.4.3",
    "numpy>=2.5.3",
    "sounddevice>=0.5.6",
    "soundfile>=0.14.0",
    "webrtcvad-wheels>=2.0.14.post1",
]

[project.scripts]
claude-voice = "claude_voice:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.format]
# Stable formatting only, so local and CI runs agree.
preview = false

[tool.ruff.lint]
# Same rule set as signalwire-python: defaults (E4/E7/E9, F) plus bugbear, bandit,
# comprehensions, perf, simplify, pathlib, return, ruff-specific and pyupgrade.
# E501 is left to the formatter.
select = ["E4", "E7", "E9", "F", "B", "S", "C4", "PERF", "SIM", "PTH", "RET", "RUF", "UP"]

[tool.ruff.lint.per-file-ignores]
# Tests assert by definition.
"tests/**" = ["S101"]
